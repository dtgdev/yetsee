[project]
name = "yetsee-api"
version = "0.9.0a3"
description = "YetSee OS Alpha reference implementation"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "redis>=5.2,<6",
  "pytrends>=4.9,<5",
  "urllib3<2",
  "networkx>=3.4,<4"
]

[project.scripts]
yetsee = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.8,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
